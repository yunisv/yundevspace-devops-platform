global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Requires gitlab_rails['monitoring_whitelist'] to cover this container's
  # subnet, otherwise GitLab answers 404 (set in docker-compose.gitlab.yml).
  - job_name: gitlab
    metrics_path: /-/metrics
    static_configs:
      - targets: ["gitlab:80"]

  # Port 8082 is the dedicated metrics entrypoint enabled in docker-compose.yml.
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]
