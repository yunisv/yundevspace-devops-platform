# Policy-шлюз — единственный файл в этом репозитории. Сам ничего не
# сканирует: решает "когда" (branch/tag) и "с какими параметрами"
# (PIPELINE_MODE + ANTIVIRUS), сама работа — в
# devops/pipelines/pipeline.yml, подключается через include, не через
# trigger.
#
# ВАЖНО (было исправлено после живой поломки): раньше здесь стоял
# `trigger: project: devops/pipelines` — это multi-project pipeline,
# он запускает ОТДЕЛЬНЫЙ пайплайн в контексте проекта devops/pipelines
# со своим собственным git checkout — сканеры реально проверяли
# репозиторий devops/pipelines (наши YAML-файлы), а не код проекта,
# который пушили. Подтверждено логом:
# "Checking out ... in /builds/devops/pipelines/.git/".
#
# Правильный механизм — include: - project: (кросс-репозиторный
# include, мёржит джобы из внешнего файла в ТЕКУЩИЙ пайплайн, git
# checkout остаётся тем, что реально запушили). Из-за этого
# SOURCE_PROJECT_PATH (костыль под trigger: variables:) тоже не нужен
# — $CI_PROJECT_PATH и так корректен, раз всё выполняется в одном
# пайплайне исходного проекта.
#
# Это то, на что указывают проекты (ci_config_path), см.
# docs/ssdlc-pipeline.md.
#
# Три режима по ветке/тегу — через workflow:rules: (глобальные
# переменные пайплайна, GitLab поддерживает conditional variables
# именно на этом уровне; per-job rules:variables тут не подходят, раз
# джобы теперь не в отдельной триггер-джобе, а мёржатся напрямую):
#   - тег              -> release: всё, включая antivirus
#   - main              -> full: всё, кроме antivirus (тяжёлый — только
#                          перед релизом, не на каждый push)
#   - dev/feature/*      -> fast: только secret-scan + SAST, чтобы не
#                          тормозить обычную разработку
#   - всё остальное      -> пайплайн не создаётся вообще (when: never)
workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        PIPELINE_MODE: "release"
        ANTIVIRUS: "true"
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables:
        PIPELINE_MODE: "full"
        ANTIVIRUS: "false"
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH =~ /^feature\//'
      variables:
        PIPELINE_MODE: "fast"
        ANTIVIRUS: "false"
    - when: never

variables:
  # Автоматически для ВСЕХ проектов через этот файл — без ручной
  # CI/CD-переменной на каждый проект. Нужно, чтобы сканеры видели
  # реальный код в git submodules (напр. usta_tap/frontend), а не
  # пустую директорию-заглушку (GitLab по умолчанию их не чекаутит).
  GIT_SUBMODULE_STRATEGY: recursive

# Сабмодуль может лежать на внешнем хосте (GitHub, не сам self-hosted
# GitLab) — CI_JOB_TOKEN, которым GitLab сам себя аутентифицирует для
# сабмодулей на ТОМ ЖЕ инстансе, для внешнего git-хоста не работает.
# pre_get_sources_script выполняется ДО git clone/submodule init (то
# есть раньше любого before_script/script — обычный before_script тут
# не успел бы). Два независимых варианта, оба no-op пока соответствующие
# переменные не заданы на проекте — можно не использовать ни один,
# использовать один или оба сразу (для разных сабмодулей одного проекта):
#
# 1. SUBMODULE_MIRROR_FROM/TO — если у сабмодуля есть зеркало на ЭТОМ
#    ЖЕ self-hosted GitLab (например, приватный GitHub-репо зеркалирован
#    в devops/... на скорую руку) — подменяет URL на зеркало, авторизация
#    через CI_JOB_TOKEN (автоматически, без секретов вообще).
#    .gitmodules при этом канонично остаётся указывать на исходный хост
#    (GitHub) — обычная разработка идёт как и шла, подмена только внутри
#    CI. Предпочтительнее второго варианта, когда зеркало есть — совсем
#    без секретов.
# 2. GITHUB_TOKEN — если зеркала нет и нужен реальный доступ к самому
#    GitHub (Masked CI/CD переменная на конкретном проекте).
default:
  hooks:
    pre_get_sources_script:
      - |
        if [ -n "$SUBMODULE_MIRROR_FROM" ] && [ -n "$SUBMODULE_MIRROR_TO" ]; then
          git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@${SUBMODULE_MIRROR_TO}".insteadOf "$SUBMODULE_MIRROR_FROM"
        fi
        if [ -n "$GITHUB_TOKEN" ]; then
          git config --global url."https://oauth2:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
        fi

include:
  - project: 'devops/pipelines'
    ref: main
    file: 'pipeline.yml'
