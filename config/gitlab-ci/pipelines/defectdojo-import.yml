# Собирает все артефакты сканов (какие реально появились — часть джоб
# условные через rules: exists/PIPELINE_MODE, их отчётов может не
# быть) и импортирует каждый в DefectDojo своим scan_type.
#
# Product/Engagement — НЕ статичный числовой ID (проектов много, один
# Engagement на всех смешал бы находки разных проектов в одну кучу).
# Вместо этого — auto_create_context: DefectDojo сам заводит
# Product Type/Product/Engagement по имени, если их ещё нет (см.
# docs.defectdojo.com/import_data/import_scan_files/api_pipeline_modelling).
# $CI_PROJECT_PATH — предопределённая переменная GitLab, берётся
# напрямую (эта джоба подключена в исходный пайплайн через include: -
# project: в ssdlc.yml, а не через trigger:, поэтому checkout — код
# исходного проекта, и $CI_PROJECT_PATH корректен без всякого проброса).
#
# engagement_name = "Pipeline #${CI_PIPELINE_ID}" — НЕ постоянный общий
# "CI/CD" (было раньше): под каждый прогон пайплайна свой Engagement,
# находки разных прогонов не смешиваются внутри одного Engagement.
# Плата за это — Engagement-ов в Product со временем накопится много
# (по одному на пайплайн), но каждый содержит находки только ОДНОГО
# скана — если через несколько месяцев это станет мешать, штатная
# DefectDojo-альтернатива — reimport-scan (обновляет один и тот же
# Engagement/Test, сам закрывает пропавшие находки, не дублирует
# оставшиеся), но это отдельная задача, не то, что просили сейчас.
#
# DEFECTDOJO_TOKEN — единственная обязательная CI/CD-переменная
# проекта devops/pipelines (Settings -> CI/CD -> Variables,
# замаскировать). DEFECTDOJO_ENGAGEMENT_ID больше не нужен.
#
# DEFECTDOJO_URL/DOJO_PROJECT_NAME — опциональные CI/CD-переменные
# проекта (не заданы — берутся дефолты: наш dojo.devops.2be.az и
# $CI_PROJECT_PATH). Позволяют отдельному проекту переопределить, куда
# и под каким именем продукта импортировать находки, не трогая этот
# файл. rules: гейтится SEC_ENABLE — тот же общий тумблер, что и у
# secret-scan/sast/sca/sbom (см. их шапки).
#
# scan_type подтверждены по docs.defectdojo.com/supported_tools:
# Bandit Scan, Semgrep JSON Report, Gosec Scanner, Trufflehog Scan,
# Gitleaks Scan, CycloneDX Scan, Trivy Scan, Checkov Scan. Trivy license-
# отчёт тоже как "Trivy Scan" — тот же JSON-парсер Trivy разбирает и
# vuln, и license секции своего вывода (подтверждено скриншотом реального
# DefectDojo с отдельным Trivy Scan под лицензиями). Для остального
# (pip-audit, npm audit, retire.js, govulncheck, eslint-security,
# njsscan, Grype x2, OSV-Scanner, trivy config, ClamAV, hadolint) — нет
# подтверждённого нативного парсера на момент написания, используем
# "Generic Findings Import" как fallback — проверить на месте, вдруг
# появился нативный, тогда поменять одну строку.
defectdojo-import:
  stage: dd-import
  image: alpine:3.20
  rules:
    - if: '$SEC_ENABLE == "false"'
      when: never
    - when: always
  before_script:
    - apk add --no-cache curl
  script:
    - |
      DD_URL="${DEFECTDOJO_URL:-https://dojo.devops.2be.az}"
      DD_PRODUCT="${DOJO_PROJECT_NAME:-$CI_PROJECT_PATH}"
      DD_ENGAGEMENT="Pipeline #${CI_PIPELINE_ID}"
      import_report() {
        file="$1"
        scan_type="$2"
        if [ -f "$file" ]; then
          echo "Импорт ${file} как \"${scan_type}\" (продукт: ${DD_PRODUCT}, engagement: ${DD_ENGAGEMENT})..."
          http_code=$(curl -sS -o /tmp/dd_response.json -w '%{http_code}' \
            -H "Authorization: Token ${DEFECTDOJO_TOKEN}" \
            -F "file=@${file}" \
            -F "scan_type=${scan_type}" \
            -F "auto_create_context=True" \
            -F "product_type_name=SSDLC" \
            -F "product_name=${DD_PRODUCT}" \
            -F "engagement_name=${DD_ENGAGEMENT}" \
            "${DD_URL}/api/v2/import-scan/") || http_code="curl_failed"
          case "$http_code" in
            2??) echo "  OK (HTTP ${http_code})" ;;
            *) echo "  ОШИБКА (HTTP ${http_code}), ответ DefectDojo:"; cat /tmp/dd_response.json 2>/dev/null; echo ;;
          esac
        fi
      }
      import_report gitleaks-report.json "Gitleaks Scan"
      import_report trufflehog-report.json "Trufflehog Scan"
      import_report bandit-report.json "Bandit Scan"
      import_report semgrep-report.json "Semgrep JSON Report"
      import_report gosec-report.json "Gosec Scanner"
      import_report eslint-security-report.json "Generic Findings Import"
      import_report njsscan-report.json "Generic Findings Import"
      import_report sbom.json "CycloneDX Scan"
      import_report grype-report.json "Generic Findings Import"
      import_report osv-scanner-report.json "Generic Findings Import"
      import_report pip-audit-report.json "Generic Findings Import"
      import_report npm-audit-report.json "Generic Findings Import"
      import_report retirejs-report.json "Generic Findings Import"
      import_report govulncheck-report.json "Generic Findings Import"
      import_report trivy-fs-report.json "Trivy Scan"
      import_report trivy-license-report.json "Trivy Scan"
      import_report grype-container-report.json "Generic Findings Import"
      import_report checkov-report.json "Checkov Scan"
      import_report trivy-config-report.json "Generic Findings Import"
      import_report clamav-report.txt "Generic Findings Import"
      import_report hadolint-report.json "Generic Findings Import"
