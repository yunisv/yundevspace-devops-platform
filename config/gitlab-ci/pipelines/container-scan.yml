# Trivy — основной скан файловой системы репозитория (зависимости,
# Dockerfile), тот же инструмент, что уже используется в
# docs/architecture.md для скана собранного образа в registry. Этот
# job лёгкий и не требует docker-in-docker (не билдит образ) — если
# нужен скан именно СОБРАННОГО образа конкретного проекта, это уже
# покрыто существующим `trivy image ...` шагом в собственном
# .gitlab-ci.yml проекта, см. docs/architecture.md.
#
# Grype рядом как второе мнение (рекомендуемый в 2026 паттерн: Trivy
# основной + Grype на критичных/внешних образах для точности CVE-
# матчинга) — тот же бинарь, что уже используется в sca.yml.
#
# hadolint — линтер Dockerfile (best practices: root user, закреплённые
# версии базовых образов и т.д.) — то, что Trivy/Grype не проверяют,
# они смотрят на уязвимости, не на стиль/практики самого Dockerfile.
#
# Все джобы пропускаются в fast-режиме.

container-scan-trivy:
  stage: container
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  rules:
    - if: '$PIPELINE_MODE == "fast"'
      when: never
    - exists:
        - Dockerfile
  script:
    - trivy fs --format json -o trivy-fs-report.json . || true
  artifacts:
    when: always
    paths:
      - trivy-fs-report.json

# Отдельно от container-scan-trivy — тот же Trivy умеет сканировать
# именно лицензии зависимостей (не CVE), полезно как отдельная
# категория для compliance, не смешивать с обычным vuln-отчётом.
container-scan-trivy-license:
  stage: container
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  rules:
    - if: '$PIPELINE_MODE == "fast"'
      when: never
    - when: on_success
  script:
    - trivy fs --scanners license --format json -o trivy-license-report.json . || true
  artifacts:
    when: always
    paths:
      - trivy-license-report.json

# Distroless-образ Anchore, тот же фикс, что и у sca-grype/sbom —
# ставим бинарь через install-script на alpine, entrypoint override
# тут не спасает (нет /bin/sh в образе вендора вообще).
container-scan-grype:
  stage: container
  image: alpine:3.20
  rules:
    - if: '$PIPELINE_MODE == "fast"'
      when: never
    - exists:
        - Dockerfile
  before_script:
    - apk add --no-cache curl
    - curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
  script:
    - grype dir:. -o json > grype-container-report.json || true
  artifacts:
    when: always
    paths:
      - grype-container-report.json

# hadolint/hadolint:latest-debian (не -alpine/distroless вариант) —
# есть нормальный shell, entrypoint: [""] по тому же паттерну, что и
# у остальных CLI-инструмент-образов.
container-scan-hadolint:
  stage: container
  image:
    name: hadolint/hadolint:latest-debian
    entrypoint: [""]
  rules:
    - if: '$PIPELINE_MODE == "fast"'
      when: never
    - exists:
        - Dockerfile
  script:
    - hadolint --no-fail -f json Dockerfile > hadolint-report.json || true
  artifacts:
    when: always
    paths:
      - hadolint-report.json
