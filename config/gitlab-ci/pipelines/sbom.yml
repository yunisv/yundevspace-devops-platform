# SBOM — опись состава проекта, входной артефакт для sca-grype (см.
# sca.yml, needs: ['sbom']) и license-compliance в дальнейшем.
# Пропускается в fast-режиме вместе с остальными "тяжёлыми" стадиями
# (secret-scan/SAST всегда бегут, эта — нет).
#
# Образ — из своего registry (devops/scanner-images, см.
# docs/scanner-images.md): alpine + скопированный бинарь syft, без
# curl-install воркэраунда (вендорский anchore/syft — distroless, там
# вообще нет /bin/sh, entrypoint: [""] такое не чинит, поэтому раньше
# ставили бинарь через install-script на голый alpine на лету — свой
# образ уже содержит бинарь, ничего ставить не нужно).
#
# Первый rules-пункт — SEC_ENABLE/SCA_ENABLE, те же CI/CD-переменные,
# что и в sca.yml: sbom фидит только sca-grype (needs: ['sbom']), так
# что гейтится той же парой, что и вся sca-стадия.
sbom:
  stage: sbom
  image: registry.devops.2be.az/devops/scanner-images/syft:latest
  rules:
    - if: '$SEC_ENABLE == "false" || $SCA_ENABLE == "false"'
      when: never
    - if: '$PIPELINE_MODE == "fast"'
      when: never
    - when: on_success
  script:
    - syft dir:. -o cyclonedx-json=sbom.json
  artifacts:
    when: always
    paths:
      - sbom.json
