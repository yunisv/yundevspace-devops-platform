# SCA / dependency scanning — уязвимости в сторонних библиотеках, то,
# что SAST (смотрит только на свой код) не видит вообще.
#
# Всё в этом файле пропускается в fast-режиме (PIPELINE_MODE=fast,
# dev/feature-ветки) — медленнее secret-scan/SAST, не нужно на каждый
# push при обычной разработке, достаточно на main/тегах.
#
# sca-grype и sca-osv-scanner — универсальные, не завязаны на конкретный
# язык (в отличие от pip-audit/npm-audit/retire.js/govulncheck ниже) —
# дополняют их, не заменяют: grype сканирует уже готовый SBOM
# (переиспользует sbom.yml, не гоняет инвентарь второй раз), osv-scanner
# сам проходит по репозиторию, известен низким false-positive rate.

# И grype, и syft (sbom.yml) — от Anchore, тот же distroless-образ без
# /bin/sh, что уже подтвердилось живым падением sbom с "sh: not found".
# entrypoint: [""] тут не спасает в принципе — ставим бинарь через
# официальный install-script на обычный alpine, как и в sbom.yml.
sca-grype:
  stage: sca
  image: alpine:3.20
  needs: ['sbom']
  rules:
    - if: '$SEC_ENABLE == "false" || $SCA_ENABLE == "false"'
      when: never
    - if: '$PIPELINE_MODE == "fast"'
      when: never
    - when: on_success
  before_script:
    - apk add --no-cache curl
    - curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
  script:
    - grype sbom:sbom.json -o json > grype-report.json || true
  artifacts:
    when: always
    paths:
      - grype-report.json

# osv-scanner — тоже вероятно distroless (тот же паттерн у Google-образов),
# та же тактика: не образ вендора, а бинарь с GitHub Releases на alpine.
# Имя ассета релиза может отличаться от версии к версии — если curl
# ниже вернёт 404, проверить актуальное имя на
# github.com/google/osv-scanner/releases/latest.
sca-osv-scanner:
  stage: sca
  image: alpine:3.20
  rules:
    - if: '$SEC_ENABLE == "false" || $SCA_ENABLE == "false"'
      when: never
    - if: '$PIPELINE_MODE == "fast"'
      when: never
    - when: on_success
  before_script:
    - apk add --no-cache curl
    - curl -sSfL -o /usr/local/bin/osv-scanner
      https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
    - chmod +x /usr/local/bin/osv-scanner
  script:
    - osv-scanner scan --format json --output osv-scanner-report.json -r . || true
  artifacts:
    when: always
    paths:
      - osv-scanner-report.json

sca-pip-audit:
  stage: sca
  image: python:3.12-slim
  rules:
    - if: '$SEC_ENABLE == "false" || $SCA_ENABLE == "false"'
      when: never
    - if: '$PIPELINE_MODE == "fast"'
      when: never
    - exists:
        - '**/*.py'
  before_script:
    - pip install --quiet pip-audit
  script:
    - pip-audit -f json -o pip-audit-report.json || true
  artifacts:
    when: always
    paths:
      - pip-audit-report.json

sca-npm-audit:
  stage: sca
  image: node:20-alpine
  rules:
    - if: '$SEC_ENABLE == "false" || $SCA_ENABLE == "false"'
      when: never
    - if: '$PIPELINE_MODE == "fast"'
      when: never
    - exists:
        - package.json
  script:
    - npm audit --json > npm-audit-report.json || true
  artifacts:
    when: always
    paths:
      - npm-audit-report.json

sca-retirejs:
  stage: sca
  image: node:20-alpine
  rules:
    - if: '$SEC_ENABLE == "false" || $SCA_ENABLE == "false"'
      when: never
    - if: '$PIPELINE_MODE == "fast"'
      when: never
    - exists:
        - package.json
  before_script:
    - npm install --no-save retire
  script:
    - npx retire --outputformat json --outputpath retirejs-report.json || true
  artifacts:
    when: always
    paths:
      - retirejs-report.json

sca-govulncheck:
  stage: sca
  image: golang:1.23
  rules:
    - if: '$SEC_ENABLE == "false" || $SCA_ENABLE == "false"'
      when: never
    - if: '$PIPELINE_MODE == "fast"'
      when: never
    - exists:
        - '**/*.go'
  before_script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
  script:
    - govulncheck -json ./... > govulncheck-report.json || true
  artifacts:
    when: always
    paths:
      - govulncheck-report.json
