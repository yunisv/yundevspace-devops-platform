# SCA / dependency scanning — уязвимости в сторонних библиотеках, то,
# что SAST (смотрит только на свой код) не видит вообще.
#
# Всё в этом файле пропускается в fast-режиме (PIPELINE_MODE=fast,
# dev/feature-ветки) — медленнее secret-scan/SAST, не нужно на каждый
# push при обычной разработке, достаточно на main/тегах.
#
# sca-grype и sca-osv-scanner — универсальные, не завязаны на конкретный
# язык (в отличие от pip-audit/npm-audit/retire.js/govulncheck ниже) —
# дополняют их, не заменяют: grype сканирует уже готовый SBOM
# (переиспользует sbom.yml, не гоняет инвентарь второй раз), osv-scanner
# сам проходит по репозиторию, известен низким false-positive rate.

# И grype, и syft (sbom.yml) — из своего registry (devops/scanner-images):
# alpine + скопированный бинарь, без curl-install воркэраунда
# (вендорские образы Anchore — distroless, без /bin/sh, entrypoint: [""]
# такое не чинит — раньше ставили бинарь на голый alpine на лету, свой
# образ уже содержит бинарь).
sca-grype:
  stage: sca
  image: registry.devops.2be.az/devops/scanner-images/grype:latest
  needs: ['sbom']
  rules:
    - if: '$SEC_ENABLE == "false" || $SCA_ENABLE == "false"'
      when: never
    - if: '$PIPELINE_MODE == "fast"'
      when: never
    - when: on_success
  script:
    - grype sbom:sbom.json -o json > grype-report.json || true
  artifacts:
    when: always
    paths:
      - grype-report.json

# osv-scanner — свой образ (devops/scanner-images), тот же принцип:
# бинарь уже внутри, раньше ставили с GitHub Releases на голый alpine
# на лету.
sca-osv-scanner:
  stage: sca
  image: registry.devops.2be.az/devops/scanner-images/osv-scanner:latest
  rules:
    - if: '$SEC_ENABLE == "false" || $SCA_ENABLE == "false"'
      when: never
    - if: '$PIPELINE_MODE == "fast"'
      when: never
    - when: on_success
  script:
    - osv-scanner scan --format json --output osv-scanner-report.json -r . || true
  artifacts:
    when: always
    paths:
      - osv-scanner-report.json

sca-pip-audit:
  stage: sca
  image: python:3.12-slim
  rules:
    - if: '$SEC_ENABLE == "false" || $SCA_ENABLE == "false"'
      when: never
    - if: '$PIPELINE_MODE == "fast"'
      when: never
    - exists:
        - '**/*.py'
  before_script:
    - pip install --quiet pip-audit
  script:
    - pip-audit -f json -o pip-audit-report.json || true
  artifacts:
    when: always
    paths:
      - pip-audit-report.json

sca-npm-audit:
  stage: sca
  image: node:20-alpine
  rules:
    - if: '$SEC_ENABLE == "false" || $SCA_ENABLE == "false"'
      when: never
    - if: '$PIPELINE_MODE == "fast"'
      when: never
    - exists:
        - package.json
  script:
    - npm audit --json > npm-audit-report.json || true
  artifacts:
    when: always
    paths:
      - npm-audit-report.json

sca-retirejs:
  stage: sca
  image: node:20-alpine
  rules:
    - if: '$SEC_ENABLE == "false" || $SCA_ENABLE == "false"'
      when: never
    - if: '$PIPELINE_MODE == "fast"'
      when: never
    - exists:
        - package.json
  before_script:
    - npm install --no-save retire
  script:
    - npx retire --outputformat json --outputpath retirejs-report.json || true
  artifacts:
    when: always
    paths:
      - retirejs-report.json

sca-govulncheck:
  stage: sca
  image: golang:1.23
  rules:
    - if: '$SEC_ENABLE == "false" || $SCA_ENABLE == "false"'
      when: never
    - if: '$PIPELINE_MODE == "fast"'
      when: never
    - exists:
        - '**/*.go'
  before_script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
  script:
    - govulncheck -json ./... > govulncheck-report.json || true
  artifacts:
    when: always
    paths:
      - govulncheck-report.json
