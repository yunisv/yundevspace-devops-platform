# Секреты ищем всегда, независимо от языка — не гейтится по exists.
secret-scan:
  stage: secret
  image: trufflesecurity/trufflehog:latest
  script:
    # || true — trufflehog возвращает ненулевой код при найденных секретах,
    # это не должно останавливать пайплайн (решение — за quality-gate,
    # не за этой джобой).
    - trufflehog filesystem . --json > trufflehog-report.json || true
  artifacts:
    when: always
    paths:
      - trufflehog-report.json
