# Секреты ищем всегда, независимо от языка И от PIPELINE_MODE (даже в
# fast-режиме на dev/feature-ветках) — самая дешёвая и при этом самая
# критичная проверка, не гейтится по режиму. Гейтится только по
# SEC_ENABLE/SECRETS_SCAN_ENABLE — обычные CI/CD-переменные, которые
# проект может выставить у себя (Settings -> CI/CD -> Variables), чтобы
# принудительно выключить (по умолчанию — включено, пустая/незаданная
# переменная не равна "false", значит проверка проходит).
#
# Два инструмента намеренно, не один — разные сильные стороны:
# gitleaks быстрый regex-скан с высоким recall на кастомных паттернах,
# trufflehog верифицирует, что найденный секрет реально "живой" (высокая
# точность, меньше false positive). Вместе покрывают друг друга.
#
# Образы — из своего registry (devops/scanner-images, см.
# docs/scanner-images.md): alpine + скопированный бинарь, без
# vendor-ENTRYPOINT, поэтому entrypoint: [""] тут больше не нужен
# (изначальные образы вендора этого требовали — ENTRYPOINT был самим
# бинарём, что ломало стандартное GitLab CI script-заворачивание в
# `sh -c "..."`; свой образ собран с обычным shell без переопределённого
# entrypoint, GitLab сам подставляет свой скрипт как раньше).

secret-scan-gitleaks:
  stage: secret
  image: registry.devops.2be.az/devops/scanner-images/gitleaks:latest
  rules:
    - if: '$SEC_ENABLE == "false" || $SECRETS_SCAN_ENABLE == "false"'
      when: never
    - when: on_success
  script:
    - gitleaks detect --source . --report-format json --report-path gitleaks-report.json --exit-code 0
  artifacts:
    when: always
    paths:
      - gitleaks-report.json

secret-scan-trufflehog:
  stage: secret
  image: registry.devops.2be.az/devops/scanner-images/trufflehog:latest
  rules:
    - if: '$SEC_ENABLE == "false" || $SECRETS_SCAN_ENABLE == "false"'
      when: never
    - when: on_success
  script:
    # || true — trufflehog возвращает ненулевой код при найденных секретах,
    # это не должно останавливать пайплайн (решение — за quality-gate,
    # не за этой джобой).
    - trufflehog filesystem . --json > trufflehog-report.json || true
  artifacts:
    when: always
    paths:
      - trufflehog-report.json
