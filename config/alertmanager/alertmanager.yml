route:
  receiver: default
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    webhook_configs:
      # Internal docker service name, not the public domain — this traffic
      # never needs to leave the edge network, and going out through
      # Traefik/public DNS for container-to-container calls is exactly the
      # kind of self-inflicted routing bug already hit once in this repo
      # (see the gitlab `hostname:` fix). Create a Webhook-trigger workflow
      # in n8n listening on this exact path (docs/ai-agents-roadmap.md) —
      # until then, Alertmanager will just log delivery failures here,
      # which is safe but means alerts currently go nowhere.
      - url: http://n8n:5678/webhook/alertmanager
        send_resolved: true
