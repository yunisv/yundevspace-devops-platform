# Core layer: reverse proxy + TLS + SSO.
# Every other stack file (docker-compose.*.yml) attaches to the `edge` network
# and gets its routing defined via Traefik labels, so services can be added
# or removed independently of this file.

networks:
  edge:
    name: devops_edge
    # Pinned so config/traefik/dynamic/access.yml can allow exactly this
    # range rather than the whole 172.16.0.0/12 private block.
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET}

volumes:
  traefik-acme:
  keycloak-db-data:

services:
  traefik:
    image: traefik:v3.6.7
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      # DNS-01, not HTTP-01: proves domain ownership via a TXT record, so
      # port 80 doesn't have to be open to the internet at all. It's also the
      # only challenge type that can issue a wildcard certificate.
      - --certificatesresolvers.le.acme.dnschallenge=true
      - --certificatesresolvers.le.acme.dnschallenge.provider=hetzner
      # TLS on by default for every router here, but deliberately WITHOUT a
      # certresolver: a resolver set at the entrypoint makes Traefik order a
      # separate certificate per subdomain and never generate the wildcard
      # (traefik/traefik#12109). Instead exactly one router below requests
      # the wildcard, and everyone else is served it from the cert store —
      # which is what keeps git./prometheus./dash. out of the public
      # Certificate Transparency logs.
      - --entrypoints.websecure.http.tls=true
      - --api.dashboard=true
      # Prometheus scrapes this (see config/prometheus/prometheus.yml). Without
      # these flags there is nothing listening for metrics at all.
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      # Applies the headers middleware from config/traefik/dynamic/ to every
      # router on this entrypoint, instead of leaving it defined but unused.
      - --entrypoints.websecure.http.middlewares=security-headers@file
    environment:
      # Hetzner API token for the DNS-01 challenge above. Hetzner merged DNS
      # management into the unified Hetzner Console in 2026 — zones created
      # there use the Cloud API, not the old dns.hetzner.com API, and need a
      # token generated in that same Console (Security -> API Tokens), not
      # the legacy DNS Console. lego only added support for this under
      # HETZNER_API_TOKEN in v4.27; v3.6.7 here bundles v4.30+. Pinning to
      # anything older breaks cert issuance for zones created after the
      # migration — verify HETZNER_API_TOKEN against whatever image tag you
      # bump this to.
      HETZNER_API_TOKEN: ${HETZNER_API_TOKEN}
    ports:
      # Bound to the NetBird mesh interface only (see docs/vpn-netbird.md) —
      # the platform never listens on the public interface at all, so there
      # is nothing to reach from the internet even before firewall rules.
      # No :80 either, since ACME uses DNS-01.
      - "${BIND_ADDRESS}:443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/acme
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./secrets/dashboard.htpasswd:/etc/traefik/dashboard.htpasswd:ro
    networks:
      edge:
        # Lets any container on this network reach any of our own subdomains
        # directly by Traefik's container IP instead of hairpinning back out
        # through the host's own NetBird interface, which times out — Docker
        # doesn't reliably route a container's request back to its own
        # host's external-facing address. Hit this twice already: oauth2-proxy
        # -> sso.${BASE_DOMAIN} for OIDC discovery, and gitlab-runner ->
        # git.${BASE_DOMAIN} for job polling (runner sat "online" but every
        # poll timed out after 30s — indistinguishable from the runner being
        # dead unless you check the container's own logs). Aliasing every
        # subdomain we route through Traefik here avoids hitting this same
        # bug again one service at a time.
        aliases:
          - traefik.${BASE_DOMAIN}
          - sso.${BASE_DOMAIN}
          - git.${BASE_DOMAIN}
          - registry.${BASE_DOMAIN}
          - prometheus.${BASE_DOMAIN}
          - alerts.${BASE_DOMAIN}
          - grafana.${BASE_DOMAIN}
          - automation.${BASE_DOMAIN}
          - dash.${BASE_DOMAIN}
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.${BASE_DOMAIN}`)
      - traefik.http.routers.traefik.entrypoints=websecure
      - traefik.http.routers.traefik.service=api@internal
      # The single wildcard request for the whole platform. Every other
      # router omits certresolver and is served this certificate from the
      # store; see the entrypoint comment above for why it lives here.
      - traefik.http.routers.traefik.tls.certresolver=le
      - traefik.http.routers.traefik.tls.domains[0].main=${BASE_DOMAIN}
      - traefik.http.routers.traefik.tls.domains[0].sans=*.${BASE_DOMAIN}
      - traefik.http.routers.traefik.middlewares=internal-only@file,dashboard-auth
      - traefik.http.middlewares.dashboard-auth.basicauth.usersfile=/etc/traefik/dashboard.htpasswd
      - homepage.group=Platform
      - homepage.name=Traefik
      - homepage.icon=traefik.png
      - homepage.href=https://traefik.${BASE_DOMAIN}
      - homepage.description=Маршрутизация и TLS-сертификаты

  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - edge

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    # Plain `start`, not `start --optimized`: `db` is a build-time option, so
    # --optimized would run against the image's default (dev-file) build and
    # ignore KC_DB below. `start` performs the build on first boot instead.
    command: start --proxy-headers=xforwarded --hostname-strict=false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # In `start` (production) mode, --proxy-headers alone isn't enough —
      # Keycloak 25 still requires HTTPS key material and refuses to boot
      # without this, crash-looping with "Key material not provided to
      # setup HTTPS" forever. Traefik already terminates TLS, so plain HTTP
      # to this container is fine.
      KC_HTTP_ENABLED: "true"
    depends_on:
      - keycloak-db
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.http.routers.keycloak.rule=Host(`sso.${BASE_DOMAIN}`)
      # Internal like everything else: this Keycloak is only for the
      # platform's own services (GitLab/Grafana/dashboard). VPN login itself
      # is handled by NetBird's own control plane on the separate edge
      # server — see docs/vpn-netbird.md.
      - traefik.http.routers.keycloak.middlewares=internal-only@file
      - traefik.http.routers.keycloak.entrypoints=websecure
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
      - homepage.group=Platform
      - homepage.name=Keycloak
      - homepage.icon=keycloak.png
      - homepage.href=https://sso.${BASE_DOMAIN}
      - homepage.description=SSO, пользователи, realm-ы
