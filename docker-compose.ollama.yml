# Local LLM runtime for AI-agent workflows (docs/ai-agents-roadmap.md,
# docs/local-llm.md). n8n's HTTP Request node calls Ollama's OpenAI-compatible
# API directly over the docker network (http://ollama:11434) — no Traefik
# route, no VPN exposure: only n8n needs to reach it, so it isn't published
# anywhere a browser could hit it.

# NOT external:true — see docker-compose.gitlab.yml for why.
networks:
  edge:
    name: devops_edge

volumes:
  ollama-data:

services:
  ollama:
    image: ollama/ollama:0.3.14
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0
      # One model resident at a time — this host already runs GitLab/Plane/
      # DefectDojo/Keycloak/monitoring, so nothing here should be able to
      # silently double its memory footprint by loading a second model.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - edge
    # Hard cap so a big/concurrent inference run can't starve the rest of the
    # stack. Size these from docs/local-llm.md's tier table before first
    # deploy — defaults below are the smallest (4-8GB-free) tier.
    mem_limit: ${OLLAMA_MEM_LIMIT:-4g}
    cpus: ${OLLAMA_CPU_LIMIT:-2}
