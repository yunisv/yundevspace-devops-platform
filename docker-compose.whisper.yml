# Local speech-to-text for the Telegram voice-command bot (docs/telegram-bot.md).
# Transcribes voice messages before n8n hands the text to DeepSeek for intent
# routing — kept local unlike the LLM call: voice commands can reference
# internal project/finding details, no reason to ship raw audio to a third
# party when the server can transcribe it itself.

# NOT external:true — see docker-compose.gitlab.yml for why.
networks:
  edge:
    name: devops_edge

volumes:
  whisper-cache:

services:
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    restart: unless-stopped
    environment:
      ASR_MODEL: ${WHISPER_MODEL:-small}
      ASR_ENGINE: faster_whisper
      # Russian by default — set to blank to let it auto-detect language
      # per request instead, at a small accuracy/speed cost.
      ASR_MODEL_LANG: ${WHISPER_LANG:-ru}
    volumes:
      - whisper-cache:/root/.cache
    networks:
      - edge
    # Sized to leave headroom for GitLab/DefectDojo — the intent-routing LLM
    # is now a SaaS API call (DeepSeek), not a local process competing for
    # the same CPU/RAM, so this no longer needs to be split with anything.
    mem_limit: ${WHISPER_MEM_LIMIT:-4g}
    cpus: ${WHISPER_CPU_LIMIT:-4}
