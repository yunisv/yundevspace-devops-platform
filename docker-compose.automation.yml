# Automation glue: n8n. Receives webhooks from GitLab (MR opened, pipeline
# finished), Plane (task created/updated), DefectDojo (new finding),
# Alertmanager, etc. and routes them to Slack/Telegram/Plane tickets. This
# is also the intended host for the future AI-agent workflows (see
# docs/ai-agents-roadmap.md) — n8n calls out to an LLM API node and feeds
# the result back into the pipeline (e.g. as a GitLab MR comment or a gate).

networks:
  edge:
    external: true
    name: devops_edge

volumes:
  n8n-data:

services:
  n8n:
    image: n8nio/n8n:1.60.1
    restart: unless-stopped
    environment:
      N8N_HOST: automation.${BASE_DOMAIN}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://automation.${BASE_DOMAIN}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Europe/Moscow
      # No N8N_BASIC_AUTH_* here: n8n removed basic auth in 1.0 (this image is
      # 1.60.1), so those variables are silently ignored. Access is controlled
      # by n8n's own user management — create the owner account on first visit,
      # and do it immediately: until you do, anyone reaching the URL can claim it.
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`automation.${BASE_DOMAIN}`)
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.routers.n8n.middlewares=internal-only@file
      - traefik.http.services.n8n.loadbalancer.server.port=5678
      - homepage.group=Automation
      - homepage.name=n8n
      - homepage.icon=n8n.png
      - homepage.href=https://automation.${BASE_DOMAIN}
      - homepage.description=Вебхуки, автоматизация, AI-агенты
