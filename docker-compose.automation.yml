# Automation glue: n8n. Receives webhooks from GitLab (MR opened, pipeline
# finished), Plane (task created/updated), DefectDojo (new finding),
# Alertmanager, etc. and routes them to Slack/Telegram/Plane tickets. This
# is also the intended host for the future AI-agent workflows (see
# docs/ai-agents-roadmap.md) — n8n calls out to an LLM API node and feeds
# the result back into the pipeline (e.g. as a GitLab MR comment or a gate).

# NOT external:true — see docker-compose.gitlab.yml for why.
networks:
  edge:
    name: devops_edge

volumes:
  n8n-data:

services:
  n8n:
    # Bumped from 1.60.1: the OIDC hook below needs @n8n/di and
    # services/jwt.service.js, neither of which exist before ~1.70-1.75.
    # Verified present at 1.80.0 directly against n8n-io/n8n's source tree
    # before pinning here — 1.60.1 would have made the hook fail at startup.
    image: n8nio/n8n:1.80.0
    restart: unless-stopped
    environment:
      N8N_HOST: automation.${BASE_DOMAIN}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://automation.${BASE_DOMAIN}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Europe/Moscow
      # No N8N_BASIC_AUTH_* here: n8n removed basic auth in 1.0, so those
      # variables are silently ignored. Local email/password accounts still
      # work as a fallback — the OIDC hook below only ADDS Keycloak as a
      # login option, it doesn't disable n8n's own user management.
      #
      # SSO via Keycloak (devops realm), using the third-party n8n-oidc
      # external-hooks project (https://github.com/cweagans/n8n-oidc) since
      # n8n Community has no free native SSO (that's Enterprise-only). Code
      # reviewed before deploying: uses only built-in Node modules, has
      # proper state/nonce CSRF checks, and correctly creates new OIDC users
      # as global:member (not owner) once an owner already exists. The real
      # risk is that it reaches into n8n's internal, undocumented module
      # paths (DI container, JwtService) rather than a public API — a future
      # n8n version bump can silently break login without warning, so check
      # this hook still works before bumping the image tag again.
      N8N_PROXY_HOPS: "1"
      N8N_ADDITIONAL_NON_UI_ROUTES: auth
      EXTERNAL_HOOK_FILES: /home/node/.n8n/hooks.js
      EXTERNAL_FRONTEND_HOOKS_URLS: /assets/oidc-frontend-hook.js
      OIDC_ISSUER_URL: https://sso.${BASE_DOMAIN}/realms/${KEYCLOAK_REALM}
      OIDC_CLIENT_ID: ${N8N_OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${N8N_OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: https://automation.${BASE_DOMAIN}/auth/oidc/callback
      # Токен Telegram-бота и Plane API — читаются из $env внутри нод
      # telegram-voice-commands.json (HTTP Request URL-expression'ы,
      # код-ноды) вместо того, чтобы быть вписанными буквально в каждую
      # ноду по отдельности — ротация токена (например, после
      # компрометации бота) = поменять тут и в .env, ноды не трогать.
      # N8N_BLOCK_ENV_ACCESS_IN_NODE=false — явно, чтобы $env точно был
      # доступен в код-нодах/expression вне зависимости от дефолта
      # конкретной версии n8n (в части версий community по умолчанию
      # заблокирован из соображений безопасности).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      PLANE_TOKEN: ${PLANE_TOKEN}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./config/n8n/hooks.js:/home/node/.n8n/hooks.js:ro
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`automation.${BASE_DOMAIN}`)
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.routers.n8n.middlewares=internal-only@file
      - traefik.http.services.n8n.loadbalancer.server.port=5678
      - homepage.group=Automation
      - homepage.name=n8n
      - homepage.icon=n8n.png
      - homepage.href=https://automation.${BASE_DOMAIN}
      - homepage.description=Вебхуки, автоматизация, AI-агенты
